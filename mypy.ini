; Verificacion estatica de tipos en modo estricto.
;
; Se corre con:  python -m mypy reconciliacion
;
; Las unicas excepciones son las dos librerias de terceros que no publican
; anotaciones de tipos. Estan acotadas al modulo que las usa, no desactivadas
; globalmente, para que el resto del codigo siga bajo modo estricto.

[mypy]
strict = True
warn_unused_configs = True
show_error_codes = True
exclude = (^|/)tests/

; customtkinter no trae anotaciones ni marcador py.typed. Sin esto, heredar de
; CTk seria "heredar de Any" y el modo estricto lo rechaza.
[mypy-customtkinter.*]
ignore_missing_imports = True

[mypy-reconciliacion.gui.app]
disallow_subclassing_any = False

; openpyxl publica sus tipos en el paquete aparte types-openpyxl, incluido en
; requirements-dev.txt. Esta seccion evita que falle si no esta instalado.
[mypy-openpyxl.*]
ignore_missing_imports = True
